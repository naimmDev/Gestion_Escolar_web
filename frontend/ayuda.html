<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayuda — Gestión Escolar</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/base.css?v=1" />
    <link rel="stylesheet" href="css/ayuda.css?v=4" />
</head>

<body>
    <div class="ayuda-container">
        <header class="ayuda-header">
            <button class="btn-volver" onclick="volverAlPanel()">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
            <h1><i class="fas fa-circle-question"></i> Centro de Ayuda</h1>
            <p>
                Encuentra respuestas rápidas a las preguntas más comunes sobre el
                sistema.
            </p>
        </header>

        <div class="ayuda-search">
            <input type="text" id="ayudaSearch" placeholder="Buscar en la ayuda..." />
        </div>

        <main id="ayudaContent" class="ayuda-content"></main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/api.js?v=3"></script>
    <script src="js/common.js?v=1"></script>
    <script src="js/ayuda.js?v=9"></script>
    <script src="js/pwa.js" defer></script>
</body>

</html>
